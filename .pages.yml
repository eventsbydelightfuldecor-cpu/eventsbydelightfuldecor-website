# .pagescms/config.yml

# Basic Site Settings
site_url: "https://eventsbydelightfuldecor.com/"

# Content Structure
content:
  - name: Pages
    label: Website Pages
    type: collection
    path: content/pages # Adjust this to where your HTML/Markdown files live
    format: html
    fields:
      - name: title
        label: Page Title
        type: string
      - name: body
        label: Content
        type: rich-text

  - name: Gallery
    label: Event Gallery
    type: collection
    path: assets/images/gallery
    fields:
      - name: image
        label: Event Photo
        type: image
      - name: caption
        label: Event Description
        type: string

# Media Settings
media:
  input: assets/images
  output: /assets/images